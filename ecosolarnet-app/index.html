<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECOSOLARNET</title>
<meta name="theme-color" content="#48484a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECOSOLARNET">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" class="brand-logo">
      <span>ECOSOLARNET</span>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button data-route="dashboard" class="tab-btn active">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg></span><span>Accueil</span>
    </button>
    <button data-route="clients" class="tab-btn">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c1-4 4.5-6 7-6s6 2 7 6"/></svg></span><span>Clients</span>
    </button>
    <button data-route="planning" class="tab-btn">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg></span><span>Tournées</span>
    </button>
    <button data-route="waitlist" class="tab-btn">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12"/><path d="M7 3v2.2c0 1.6.8 3.1 2.1 4L12 12l2.9-2.8c1.3-.9 2.1-2.4 2.1-4V3"/><path d="M17 21v-2.2c0-1.6-.8-3.1-2.1-4L12 12l-2.9 2.8c-1.3.9-2.1 2.4-2.1 4V21"/></svg></span><span>Attente</span>
    </button>
    <button data-route="devis" class="tab-btn">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7Z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg></span><span>Devis</span>
    </button>
    <button data-route="emails" class="tab-btn">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4Z"/><path d="m4 7 8 6 8-6"/></svg></span><span>Emails</span>
    </button>
    <button data-route="settings" class="tab-btn">
      <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M3 12h2.4M18.6 12H21M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg></span><span>Réglages</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/qrcode.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
